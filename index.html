/* Layout: P&ID-inspired engineering sheet. Sticky header, bio row (avatar left / text right), 3-col project grid that collapses to 2 then 1. */
/* Single light theme by choice: warm beige paper, natural earth tones. */
:root {
  --bg: #f5e6d3;          /* warm parchment */
  --surface: #faefe2;
  --ink: #3b2418;         /* dark umber */
  --muted: #8a6450;
  --line: #e3c9ae;
  --accent: #b5562b;      /* burnt sienna */
  --accent-soft: #f2d5bd;
  --tile: #eed6bc;        /* toasted sand */
  --frame: #fbecd6;       /* icon border: warm light cream */
  color-scheme: light;
  /* One variable family, three voices: heavy monospace headings, monospace labels, proportional body */
  --font-display: "Geist Pixel", ui-monospace, "Courier New", monospace;
  --font-body: "Fragment Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-mono: "Sono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --maxw: 1080px;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.7;
  font-weight: 400;
  font-variation-settings: "MONO" 0;
}
/* Monospace voice for headings and labels */
h1, h2, h3, .page-title, .tile .label strong, .tagline, .links a, .tag,
.tile .label .lm, .specs dt, .meta-line, .back, .note, footer, .art-slot, .section-head .count {
  font-variation-settings: "MONO" 1;
}
h1, h2, h3, .page-title, .tile .label strong { font-weight: 500 !important; letter-spacing: .02em !important; }
h1, h2, h3, .page-title, .tile .label strong { text-transform: uppercase; }
.noop {
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Header ---------- */
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.nav {
  display: flex; align-items: center; gap: 28px;
  padding-block: 14px;
}
.home {
  display: grid; place-items: center;
  width: 42px; height: 42px; flex: none;
  color: var(--ink);
  text-decoration: none;
  transition: color .15s ease, transform .15s ease;
}
.home:hover { color: var(--accent); transform: translateY(-2px); }
.home svg { width: 36px; height: 40px; display: block; }
.links { display: flex; gap: 24px; flex-wrap: wrap; }
.links a {
  font-family: var(--font-mono);
  font-weight: 500; font-size: .9rem;
  letter-spacing: .08em; text-transform: uppercase;
  text-decoration: none; color: var(--muted);
  padding-block: 4px;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.links a:hover { color: var(--ink); }
.links a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }

main { padding-block: 48px 80px; }

/* ---------- Bio ---------- */
.bio {
  display: grid;
  grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
  gap: 40px; align-items: center;
}
.avatar {
  width: 100%; max-width: 240px; aspect-ratio: 1;
  border-radius: 24px;
  background: var(--tile);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  overflow: hidden;
}
.avatar svg { width: 100%; height: 100%; }
.bio h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: clamp(1.6rem, 3.8vw, 2.6rem);
  line-height: 1.2; letter-spacing: 0;
  margin: 0 0 12px; text-wrap: balance;
}
.tagline {
  font-family: var(--font-mono); font-size: 1rem; font-weight: 500;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 18px;
}
.bio p.body { margin: 0; max-width: 62ch; color: var(--ink); }

/* ---------- Projects ---------- */
.section-head {
  display: flex; align-items: baseline; gap: 16px;
  margin: 64px 0 22px;
}
.section-head h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: 1.8rem; line-height: 1;
  letter-spacing: 0; margin: 0;
}
.section-head .rule { flex: 1; height: 1px; background: var(--line); }
.section-head .count { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.tile {
  position: relative;
  aspect-ratio: 1; max-width: 100%;
  border-radius: 0;
  --fw: 12px;             /* frame width */
  background: var(--frame);
  container-type: inline-size;
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
  text-decoration: none; color: var(--ink);
  display: block;
}
/* The cream frame belongs to the icon layer, so it blurs together with the art on hover */
.tile .icon {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  border: var(--fw) solid var(--frame);
  background: var(--tile);
  color: var(--ink);
  transition: filter .35s ease, opacity .35s ease, transform .35s ease;
}
.tile .icon svg { width: 46%; height: 46%; }
.tile .tag {
  position: absolute; top: calc(var(--fw) + 9px); left: calc(var(--fw) + 10px); right: calc(var(--fw) + 10px);

function tileHTML(p) {
  return `<a class="tile" href="#${p.id}" data-route="${p.id}">
    ${p.img ? "" : `<span class="tag">${p.tag}</span>`}
    <span class="icon${p.img ? " has-img" : ""}">${iconOf(p)}</span>

  </a>`;
}

function homeView() {
  const tiles = projects.map(tileHTML).join("");
  // Fill the last row with an "add project" slot so the grid never has a lone tile
  const slot = `<div class="tile empty" aria-hidden="true"><span class="icon">${icons.plus}</span></div>`;
  return `

    <section class="grid">${tiles}${projects.length % 5 ? slot : ""}</section>`;
}

function projectView(p) {
  const specs = Object.entries(p.specs).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  const body = p.sections.map(([h, t]) => `<h3>${h}</h3><p>${t}</p>`).join("");
  return `
    <a class="back" href="#" data-route="">← All projects</a>
    <section class="project-hero">
      <div>
        <h1 class="page-title">${p.title}</h1>
        <p class="meta-line"><span>Project Type: <b>${p.type}</b></span><span>Status: <b>${p.status}</b></span></p>
        <p class="lede">${p.summary}</p>
      </div>
      ${p.launch
        ? `<a class="icon-lg launchable${p.img ? " has-img" : ""}" href="${p.launch}" target="_blank" rel="noopener" aria-label="Launch ${p.title} (opens in a new tab)"><span class="art">${iconOf(p)}</span><span class="launch-label">Launch ↗</span><span class="launch-hint" aria-hidden="true">▸ Click to launch ${p.title}</span></a>`
        : `<div class="icon-lg${p.img ? " has-img" : ""}">${iconOf(p)}</div>`}
    </section>
    <dl class="specs">${specs}</dl>
    <article class="prose">${body}</article>`;
}

// ---------- Router ----------
function show(route) {
  let html;
  if (route === "about") html = aboutView();
  else if (route === "art") html = artView();
  else {
    const p = projects.find(x => x.id === route);
    html = p ? projectView(p) : homeView();
    if (!p) route = "";
  }
  app.innerHTML = html;
  document.querySelectorAll(".links a").forEach(a => {
    if (a.dataset.route === route) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
const hashRoute = () => (location.hash || "").replace(/^#/, "");

// Handle link clicks in script so navigation works even if the URL can't change
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-route]");
  if (!a) return;
  e.preventDefault();
  const r = a.dataset.route;
  try { history.pushState(null, "", r ? "#" + r : location.pathname); } catch (_) {}
  show(r);
});
// Typewriter on tile hover/focus
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function typeTile(tile) {
  stopTile(tile);
  const lines = [...tile.querySelectorAll("[data-tw]")];
  if (reduceMotion) return;
  lines.forEach(el => { el.innerHTML = `<span class="tw-rest">${esc(el.dataset.tw)}</span>`; });
  let li = 0, ci = 0;
  tile._tw = setInterval(() => {
    const el = lines[li]; if (!el) { stopTile(tile, true); return; }
    const full = el.dataset.tw; ci++;
    el.innerHTML = `<span class="tw-on-wrap">${esc(full.slice(0, ci))}</span><span class="tw-rest">${esc(full.slice(ci))}</span>`;
    el.firstChild.classList.add("tw-on");
    if (ci >= full.length) { li++; ci = 0; }
  }, 32);
}
function stopTile(tile, keepCursor) {
  clearInterval(tile._tw); tile._tw = null;
  tile.querySelectorAll("[data-tw]").forEach((el, i, all) => {
    el.innerHTML = keepCursor && i === all.length - 1
      ? `<span class="tw-on">${esc(el.dataset.tw)}</span>` : esc(el.dataset.tw);
  });
}
if (matchMedia("(hover: hover)").matches) {
  app.addEventListener("mouseover", (e) => {
    const t = e.target.closest(".tile[data-route]");
    if (t && !t.contains(e.relatedTarget)) typeTile(t);
  });
  app.addEventListener("mouseout", (e) => {
    const t = e.target.closest(".tile[data-route]");
    if (t && !t.contains(e.relatedTarget)) stopTile(t);
  });
  app.addEventListener("focusin", (e) => { const t = e.target.closest(".tile[data-route]"); if (t) typeTile(t); });
  app.addEventListener("focusout", (e) => { const t = e.target.closest(".tile[data-route]"); if (t) stopTile(t); });
}

document.addEventListener("click", (e) => { const l = document.getElementById("log"); if (l.open && !l.contains(e.target)) l.open = false; });

window.addEventListener("popstate", () => show(hashRoute()));
show(hashRoute());
