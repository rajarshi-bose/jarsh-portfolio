<style>
/* Layout: a 12-column Swiss grid. Name set huge and flush left, a three-part intro row, then a full-width project index where each row reveals itself on hover. */
:root {
  --paper: #f1efe9;
  --ink: #000000;
  --muted: #6e6a62;
  --rule: #000000;
  --faint: #d8d4ca;
  --signal: #e5361b;   /* Swiss red */
  --go: #2f9e44;       /* complete */
  --font: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease-out: cubic-bezier(0.19, 1, 0.22, 1);      /* expo */
  --ease-roll: cubic-bezier(0.645, 0.045, 0.355, 1); /* in-out cubic */
  --gutter: clamp(12px, 1.6vw, 24px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121110; --ink: #f1efe9; --muted: #9a958b; --rule: #f1efe9; --faint: #2f2c28; --signal: #ff5a3c; --go: #4cc764; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121110; --ink: #f1efe9; --muted: #9a958b; --rule: #f1efe9; --faint: #2f2c28; --signal: #ff5a3c; --go: #4cc764; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }

.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1600px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }

/* ---------- Header ---------- */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); }
header .grid { padding-block: 16px; font-size: .95rem; font-weight: 500; align-items: center; }
header .me { grid-column: 1 / 4; font-weight: 700; display: inline-flex; align-items: center; gap: 9px; justify-self: start; }
header .me svg { width: 17px; height: 20px; transition: color 150ms ease, transform 200ms var(--ease-out); }
header .me:hover svg { color: var(--signal); transform: translateY(-2px); }
header nav { grid-column: 4 / 10; display: flex; gap: 22px; }
header nav a { color: var(--muted); transition: color 150ms ease; }
header nav a:hover, header nav a[aria-current="page"] { color: var(--ink); }
header .where { grid-column: 10 / 13; text-align: right; color: var(--muted); }

/* ---------- Letter machinery ---------- */
.word { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; position: relative; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
.ch > span { display: block; }
.ch > .roll { display: flex; flex-direction: column; gap: .3em; }
.roll > span { display: block; line-height: 1.12; }
.roll > .b { color: var(--signal); }
.ch.tw { padding-bottom: 0; margin-bottom: 0; line-height: 1.12; height: 1.12em; }

/* Hero intro: letters rise into place once, on load */
.hero h1 {
  font-weight: 800; letter-spacing: -0.055em; line-height: .84;
  font-size: clamp(4.2rem, 17.5vw, 19rem);
  margin: clamp(32px, 6vw, 80px) 0 0 -0.04em;
}
.hero h1 .ch { padding-bottom: .1em; margin-bottom: -.1em; }
.intro .ch > .a { transform: translateY(105%); }
.intro.go .ch > .a { transform: none; transition: transform 1000ms var(--ease-out); transition-delay: calc(var(--i) * 38ms); }

.lede-row { margin-top: clamp(28px, 4vw, 56px); padding-top: 14px; border-top: 2px solid var(--rule); row-gap: 24px; }
.lede-row .k { grid-column: 1 / 4; font-weight: 600; }
.lede-row .k span { display: block; color: var(--muted); font-weight: 500; }
.lede-row p.big { grid-column: 4 / 10; margin: 0; font-size: clamp(1.35rem, 2.2vw, 2rem); line-height: 1.18; letter-spacing: -0.02em; font-weight: 500; text-wrap: pretty; max-width: 30ch; }
.lede-row p.small { grid-column: 10 / 13; margin: 0; color: var(--muted); font-size: .95rem; max-width: 34ch; }
.fade { opacity: 1; transform: none; }
.intro .fade { opacity: 0; transform: translateY(10px); }
.intro.go .fade { opacity: 1; transform: none; transition: opacity 700ms var(--ease-out) 700ms, transform 700ms var(--ease-out) 700ms; }

/* ---------- Project grid ---------- */
.index { margin-top: clamp(72px, 10vw, 140px); }
.index-head { padding-bottom: 10px; border-bottom: 2px solid var(--rule); font-size: .9rem; color: var(--muted); font-weight: 500; align-items: baseline; }
.index-head h2 { grid-column: 1 / 7; margin: 0; font-size: inherit; font-weight: 700; color: var(--ink); }
.index-head .key { grid-column: 7 / 13; text-align: right; display: flex; justify-content: flex-end; gap: 18px; }
.key span { display: inline-flex; align-items: center; gap: 7px; }
.dot { width: .55em; height: .55em; border-radius: 50%; background: var(--go); display: inline-block; flex: none; }
.dot.live { background: var(--signal); animation: blink 1.4s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: .15; } }

.tiles { margin-top: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: var(--gutter); row-gap: clamp(36px, 4vw, 56px); }
.tile { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tile .art { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.tile .art > svg { width: 68%; height: 68%; }
.tile .art > img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.tile .art > svg, .tile .art > img { transition: filter 420ms ease, transform 420ms ease; }
.tile .reveal {
  position: absolute; inset: 0; color: #000;
  background: color-mix(in srgb, var(--signal) 88%, transparent);
  display: flex; flex-direction: column; gap: 10px; padding: clamp(12px, 1.3vw, 18px);
  opacity: 0;
}
.tile .reveal p {
  flex: 1; min-height: 0; overflow: hidden; margin: 0;
  font-size: clamp(1.3rem, 1.9vw, 1.85rem); line-height: 1.08; font-weight: 600; letter-spacing: -0.025em;
  -webkit-mask-image: linear-gradient(#000 55%, transparent 96%); mask-image: linear-gradient(#000 55%, transparent 96%);
  transform: translateY(6px); filter: blur(4px);
}
.tile .reveal span { font-size: .95rem; font-weight: 700; opacity: 0; }
.tile .cap { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-items: baseline; }
.tile .yr { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .st { font-size: .9rem; display: inline-flex; align-items: center; gap: 7px; justify-self: end; }
.tile .name { grid-column: 1 / -1; font-size: clamp(1.25rem, 1.75vw, 1.7rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1; text-wrap: balance; }
.tile .field { grid-column: 1 / -1; font-size: .95rem; color: var(--muted); }
.tile .sum { display: none; margin: 0; font-size: .95rem; color: var(--muted); }

@media (hover: hover) and (pointer: fine) {
  .tile .reveal { transition: opacity 380ms ease; }
  .tile .reveal p { transition: transform 480ms var(--ease-out) 60ms, filter 480ms var(--ease-out) 60ms; }
  .tile .reveal span { transition: opacity 300ms ease 220ms; }
  .tile:hover .reveal, .tile:focus-visible .reveal { opacity: 1; }
  .tile:hover .reveal p, .tile:focus-visible .reveal p { transform: none; filter: none; }
  .tile:hover .reveal span, .tile:focus-visible .reveal span { opacity: 1; }
  .tile:hover .art > svg, .tile:hover .art > img, .tile:focus-visible .art > svg, .tile:focus-visible .art > img { filter: blur(10px); transform: scale(1.04); }
  .tile .name .roll { transition: transform 420ms var(--ease-roll); transition-delay: calc(var(--i) * 14ms); }
  .tile:hover .name .roll, .tile:focus-visible .name .roll { transform: translateY(-1.42em); }
  .tile .field { transition: color 150ms ease; }
  .tile:hover .field { color: var(--signal); }
  .tile:focus-visible { outline: none; }
  .tile:focus-visible .art { outline: 2px solid var(--signal); outline-offset: 4px; }
}
@media (hover: none), (pointer: coarse) {
  .tile .sum { display: block; }
  .tile .reveal { display: none; }
}

/* ---------- Inner pages ---------- */
.inner { padding-top: clamp(32px, 6vw, 80px); }
.inner h1 { font-weight: 800; letter-spacing: -0.05em; line-height: .9; font-size: clamp(3rem, 9vw, 9rem); margin: 0 0 0 -0.03em; text-wrap: balance; }
.back { display: inline-flex; align-items: center; gap: .45em; color: var(--muted); font-weight: 500; margin-bottom: 28px; transition: color 150ms ease; }
.back .arr { display: inline-block; transition: transform 200ms var(--ease-out); }
.back:hover .arr { transform: translateX(-4px); }
.back:hover { color: var(--signal); }
.facts { margin-top: 40px; border-top: 2px solid var(--rule); padding-top: 14px; row-gap: 20px; }
.facts div { grid-column: span 3; min-width: 0; }
.facts dt { color: var(--muted); font-size: .9rem; }
.facts dd { margin: 2px 0 0; font-weight: 600; }
.body-text { margin-top: 56px; row-gap: 28px; }
.body-text h3 { grid-column: 1 / 4; margin: 0; font-size: 1rem; font-weight: 700; }
.body-text p { grid-column: 4 / 10; margin: 0; font-size: 1.2rem; line-height: 1.5; max-width: 60ch; }
.body-text p.draft { color: var(--muted); }
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) clamp(130px, 14vw, 190px); gap: clamp(20px, 4vw, 56px); align-items: start; }
.p-meta { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 22px 0 0; font-size: 1.05rem; color: var(--muted); }
.p-meta b { color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; }
.p-art { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--ink); color: var(--paper); display: block; }
.p-art .pa-img { position: absolute; inset: 0; display: grid; place-items: center; }
.p-art .pa-img svg { width: 66%; height: 66%; }
.p-art .pa-img img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.p-art .pa-veil { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; background: color-mix(in srgb, var(--signal) 88%, transparent); color: #000; }
.p-art .pa-go { font-size: clamp(1.4rem, 2.4vw, 2rem); font-weight: 800; letter-spacing: -0.03em; display: inline-flex; gap: .25em; filter: blur(4px); transform: translateY(6px); }
.p-art .pa-go .ne { display: inline-block; }
.p-art .pa-hint { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 7px 8px; background: var(--paper); color: var(--ink); text-align: center; font-size: .82rem; font-weight: 600; animation: hint 1.1s steps(1, end) infinite; }
@keyframes hint { 50% { opacity: 0; } }
@media (hover: hover) and (pointer: fine) {
  .p-art .pa-img { transition: filter 420ms ease, transform 420ms ease; }
  .p-art .pa-veil { transition: opacity 380ms ease; }
  .p-art .pa-go { transition: filter 480ms var(--ease-out) 60ms, transform 480ms var(--ease-out) 60ms; }
  .p-art .pa-go .ne { transition: transform 260ms var(--ease-out) 200ms; }
  .p-art .pa-hint { transition: opacity 150ms ease; }
  a.p-art:hover .pa-img, a.p-art:focus-visible .pa-img { filter: blur(10px); transform: scale(1.05); }
  a.p-art:hover .pa-veil, a.p-art:focus-visible .pa-veil { opacity: 1; }
  a.p-art:hover .pa-go, a.p-art:focus-visible .pa-go { filter: none; transform: none; }
  a.p-art:hover .pa-go .ne, a.p-art:focus-visible .pa-go .ne { transform: translate(3px, -3px); }
  a.p-art:hover .pa-hint, a.p-art:focus-visible .pa-hint { animation: none; opacity: 0; }
}
a.p-art:active { transform: scale(.98); }
.slots { margin-top: 48px; row-gap: var(--gutter); }
.slot { grid-column: span 4; aspect-ratio: 4 / 5; max-width: 100%; border: 1px solid var(--faint); display: grid; place-items: end start; padding: 12px; color: var(--muted); font-size: .9rem; }

/* ---------- Footer ---------- */
footer { margin-top: clamp(80px, 12vw, 160px); }
footer .grid { border-top: 2px solid var(--rule); padding-block: 16px 32px; row-gap: 16px; font-size: .95rem; }
footer .big { grid-column: 1 / 7; font-size: clamp(1.6rem, 3.2vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; user-select: all; overflow-wrap: anywhere; }
footer .col { grid-column: span 2; color: var(--muted); }
footer .col b { display: block; color: var(--ink); font-weight: 600; }
.log { position: relative; }
.log summary { list-style: none; cursor: pointer; }
.log summary::-webkit-details-marker { display: none; }
.log summary u { text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color 150ms ease; }
.log summary:hover u, .log[open] summary u { color: var(--signal); }
.log-panel {
  position: absolute; right: 0; bottom: calc(100% + 12px); z-index: 20;
  width: min(380px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto;
  background: var(--paper); border: 1px solid var(--rule); padding: 16px 18px;
  color: var(--ink); font-size: .92rem; line-height: 1.4;
}
.log[open] .log-panel { animation: logIn 220ms var(--ease-out); }
@keyframes logIn { from { opacity: 0; transform: translateY(6px); } }
.log-panel h4 { margin: 0 0 12px; font-size: .95rem; font-weight: 700; }
.log-entry + .log-entry { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--faint); }
.log-entry .v { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.log-entry .v span { color: var(--muted); font-weight: 500; }
.log-entry ul { margin: 6px 0 0; padding-left: 16px; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  header nav { grid-column: 4 / 13; justify-content: flex-end; }
  header .where { display: none; }
  .lede-row .k { grid-column: 1 / 13; }
  .lede-row p.big { grid-column: 1 / 13; }
  .lede-row p.small { grid-column: 1 / 13; }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .facts div { grid-column: span 6; }
  .body-text h3, .body-text p { grid-column: 1 / 13; }
  .slot { grid-column: span 6; }
  .p-head { grid-template-columns: minmax(0, 1fr); }
  .p-art { width: 132px; order: -1; }
  .p-art .pa-hint { font-size: .72rem; left: 6px; right: 6px; bottom: 6px; padding: 5px 4px; }
  footer .big { grid-column: 1 / 13; }
  footer .col { grid-column: span 4; }
}
@media (max-width: 480px) {
  header .me { grid-column: 1 / 7; }
  header nav { grid-column: 7 / 13; gap: 16px; }
  footer .col { grid-column: span 6; }
  .log-panel { right: auto; left: 0; }
  .tiles { row-gap: 32px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile .name { font-size: 1.25rem; }
  .tile .yr, .tile .st, .tile .field { font-size: .82rem; }
  .tile .sum { font-size: .88rem; }
  .index-head .key { display: none; }
  .index-head h2 { grid-column: 1 / 13; }
}
@media (prefers-reduced-motion: reduce) {
  .intro .ch > .a, .intro .fade { transform: none; opacity: 1; transition: none; }
  .tile .reveal, .tile .reveal p, .tile .reveal span, .tile .art > svg, .tile .art > img, .tile .name .roll { transition: none; }
  .dot.live, .p-art .pa-hint { animation: none; }
  .log[open] .log-panel { animation: none; }
  .p-art .pa-img, .p-art .pa-veil, .p-art .pa-go, .back .arr, header .me svg { transition: none; }
}
</style>

</head>

// Split text into words of masked letters. Each letter has a red twin underneath for the hover roll.
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function letters(text, twin) {
  let i = 0;
  return text.split(" ").map(w => `<span class="word">${[...w].map(c =>
    twin
      ? `<span class="ch tw"><span class="roll" style="--i:${i++}"><span>${esc(c)}</span><span class="b">${esc(c)}</span></span></span>`
      : `<span class="ch" style="--i:${i++}"><span class="a">${esc(c)}</span></span>`
  ).join("")}</span>`).join(" ");
}

const app = document.getElementById("app");

function homeView() {
  const tiles = projects.map(p => `
    <a class="tile" href="#${p.id}" data-route="${p.id}">
      <span class="art">${p.img ? `<img src="${p.img}" alt="">` : icons[p.icon]}
        <span class="reveal" aria-hidden="true"><p>${p.summary}</p><span>Read more</span></span>
      </span>
      <span class="cap">
        <span class="yr">${p.year}</span>
        <span class="st"><i class="dot${p.status === "Complete" ? "" : " live"}"></i>${p.status}</span>
        <span class="name" aria-label="${p.title}"><span aria-hidden="true">${letters(p.title, true)}</span></span>
        <span class="field">${p.field}</span>
      </span>
      <span class="sum">${p.summary}</span>
    </a>`).join("");
  return `
  <div class="page">
    <section class="hero intro" id="intro">
      <h1 aria-label="Jarsh Bose"><span aria-hidden="true">${letters("Jarsh Bose", false)}</span></h1>
      <div class="lede-row grid fade">
        <p class="k">Mechanical engineer<span>Propulsion and fluid systems</span></p>
        <p class="big">I design the plumbing that keeps engines fed, and I'm heading toward graduate research in cryogenic propellant management.</p>
        <p class="small">Senior at Texas A&amp;M, graduating Spring 2027. Previously at Los Alamos National Laboratory. I also make small games and tools in the browser.</p>
      </div>
    </section>
    <section class="index" aria-labelledby="idx">
      <div class="index-head grid"><h2 id="idx">Projects, ${projects.length}</h2><span class="key"><span><i class="dot live"></i>In progress</span><span><i class="dot"></i>Complete</span></span></div>
      <div class="tiles">${tiles}</div>
    </section>
  </div>`;
}

function projectView(p) {
  const facts = Object.entries(p.facts).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  const text = p.text.length
    ? p.text.map(([h, t]) => `<h3>${h}</h3><p>${t}</p>`).join("")
    : `<h3>Overview</h3><p class="draft">Write a few lines on how it works and how you built it.</p>`;
  const art = `<span class="pa-img">${p.img ? `<img src="${p.img}" alt="">` : icons[p.icon]}</span>`;
  const side = p.launch
    ? `<a class="p-art" href="${p.launch}" target="_blank" rel="noopener" aria-label="Launch ${esc(p.title)} (opens in a new tab)">${art}
         <span class="pa-veil" aria-hidden="true"><span class="pa-go">Launch<span class="ne">↗</span></span></span>
         <span class="pa-hint" aria-hidden="true">▸ Click to launch</span></a>`
    : `<div class="p-art" aria-hidden="true">${art}</div>`;
  return `
  <div class="page inner">
    <a class="back" href="#" data-route=""><span class="arr" aria-hidden="true">←</span>Back to work</a>
    <div class="p-head">
      <div>
        <h1 class="intro" id="intro" aria-label="${esc(p.title)}"><span aria-hidden="true">${letters(p.title, false)}</span></h1>
        <p class="p-meta"><span>Project type:<b>${p.field}</b></span><span>Status:<b><i class="dot${p.status === "Complete" ? "" : " live"}"></i>${p.status}</b></span></p>
      </div>
      ${side}
    </div>
    <dl class="facts grid">${facts}</dl>
    <div class="body-text grid"><h3>Summary</h3><p>${p.summary}</p>${text}</div>
  </div>`;
}
function aboutView() {
  return `
  <div class="page inner">
    <h1 class="intro" id="intro" aria-label="About"><span aria-hidden="true">${letters("About", false)}</span></h1>

      <h3>Education</h3><p>B.S. Mechanical Engineering, Texas A&amp;M University, expected Spring 2027. Applying to thesis-based M.S. and Ph.D. programs.</p>

// ---------- Router ----------
const routes = { about: aboutView, art: artView };
function show(route) {
  const p = projects.find(x => x.id === route);
  if (routes[route]) app.innerHTML = routes[route]();
  else if (p) app.innerHTML = projectView(p);
  else { route = ""; app.innerHTML = homeView(); }
  document.querySelectorAll("header nav a").forEach(a => a.dataset.route === route ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  // Play the letter intro once per view
  const intro = document.getElementById("intro");
  if (intro) { intro.classList.add("intro"); intro.getBoundingClientRect(); requestAnimationFrame(() => intro.classList.add("go")); }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-route]");
  if (!a) return;
  e.preventDefault();
  show(a.dataset.route);
});
show((location.hash || "").replace(/^#/, ""));
