<!doctype html><html><head><meta charset="utf-8">
<title>Dither Press</title>
<meta name="description" content="Dither Press: turn any image into a dithered print in your browser. By Rajarshi Bose.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;700;900&family=Sixtyfour&display=swap">
<style>
/* Layout: a fixed control rail on the left, the print on a checker "light table" on the right; stacks on phones. */
:root{
  --bg:#070a12; --panel:#0d121d; --fg:#eef1f7; --muted:#b4bccd; --line:#2a3448; --accent:#8fa9cf; --on-accent:#070a12; --table:#161d2b; color-scheme:dark;
  --display:'Sixtyfour',ui-monospace,Menlo,Consolas,monospace; --body:'Doto',ui-monospace,Menlo,Consolas,monospace; --mono:'Doto',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:700 15px/1.45 var(--body);padding-inline:16px;padding-block:20px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font:400 22px/1.2 var(--display);margin:0}
header p{margin:0;color:var(--muted)}
/* Back to jarsh.us (top-left, in this page's colors) */
@font-face{font-family:"Geist Pixel";src:url("../fonts/GeistPixel-Square.woff2") format("woff2");font-display:swap}
.jarsh-home{display:inline-flex;align-items:center;font-family:"Geist Pixel",ui-monospace,Menlo,monospace;font-size:15px;line-height:1;letter-spacing:.02em;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .15s}
.jarsh-home:hover,.jarsh-home:focus-visible{color:var(--accent)}
header .jarsh-home{flex-basis:100%;margin-bottom:6px}
.main{display:grid;grid-template-columns:372px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:2px;overflow:hidden;display:flex;flex-direction:column}
fieldset{border:0;border-bottom:2px solid var(--line);margin:0;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset:last-child{border-bottom:0}
legend{font:400 11px/1.4 var(--display);text-transform:uppercase;letter-spacing:0;color:var(--accent);padding:0;float:left;width:100%;margin-bottom:10px}
label.row{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;gap:8px;align-items:center}
label.row output{font:700 14px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
label.sel{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center}
select,button,.filebtn{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);padding:7px 10px;border-radius:2px;min-width:0}
input[type=range]{width:100%;min-width:0;height:20px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:var(--bg);border:2px solid var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:6px;background:var(--bg);border:2px solid var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;margin-top:-7px;background:var(--accent);border:0;border-radius:2px}
input[type=range]::-moz-range-thumb{width:12px;height:20px;background:var(--accent);border:0;border-radius:2px}
input[type=range]:disabled{opacity:.4;cursor:default}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:2px solid var(--line);border-radius:2px;background:var(--bg);cursor:pointer;flex:none}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--bg)}
button:disabled{opacity:.4;cursor:default}
input[type=color]{width:100%;height:30px;padding:0;border:2px solid var(--line);border-radius:2px;background:none}
button,.filebtn{cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:900;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns>*{flex:1 1 auto}
.check{display:flex;gap:8px;align-items:center}
.stage{display:flex;flex-direction:column;gap:8px;min-width:0}
.table{border:2px solid var(--line);border-radius:2px;padding:16px;display:flex;justify-content:center;
  background:repeating-conic-gradient(var(--table) 0 25%,var(--panel) 0 50%) 0 0/16px 16px}
.table.drag{outline:2px dashed var(--accent);outline-offset:-6px}
canvas{max-width:100%;height:auto;image-rendering:pixelated;display:block;max-height:80vh}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;color:var(--muted);font:700 14px/1.5 var(--mono)}
</style>

<div class="wrap">
  <header>
    <a class="jarsh-home" href="https://jarsh.us">&larr; jarsh.us</a>
    <h1>Dither Press</h1>
    <p>Drop in an image, pick a dither, save the print.</p>
  </header>
  <div class="main">
    <form class="panel" id="controls" onsubmit="return false">
      <fieldset>
        <legend>Image</legend>
        <div class="btns">
          <label class="filebtn primary" for="file">Open image</label>
          <input type="file" id="file" accept="image/*" hidden>
          <button type="button" id="save" class="primary" hidden>Save print (PNG)</button>
          <button type="button" id="reset">Reset settings</button>
        </div>
        <span id="savemsg" role="status" hidden></span>
        <label class="row">Pixel size<input type="range" id="px" min="1" max="12" step="1" value="3"><output></output></label>
        <label class="sel">Save size
          <select id="outsize">
            <option value="2000" selected>2000 px (long side)</option>
            <option value="1750">1750 px (long side)</option>
            <option value="1500">1500 px (long side)</option>
            <option value="0">Same as preview</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="orig"> Show original</label>
      </fieldset>
      <fieldset>
        <legend>Tone</legend>
        <label class="row">Brightness<input type="range" id="bright" min="-0.5" max="0.5" step="0.01" value="0"><output></output></label>
        <label class="row">Contrast<input type="range" id="contrast" min="0.2" max="3" step="0.05" value="1.1"><output></output></label>
        <label class="row">Gamma<input type="range" id="gamma" min="0.3" max="3" step="0.05" value="1"><output></output></label>
        <label class="row">Film grain<input type="range" id="grain" min="0" max="1" step="0.01" value="0"><output></output></label>
        <label class="check"><input type="checkbox" id="invert"> Invert</label>
      </fieldset>
      <fieldset>
        <legend>Dither</legend>
        <label class="sel">Method
          <select id="algo">
            <optgroup label="Error diffusion">
              <option value="fs">Floyd–Steinberg</option>
              <option value="atk">Atkinson</option>
              <option value="jjn">Jarvis–Judice–Ninke</option>
              <option value="stucki">Stucki</option>
              <option value="burkes">Burkes</option>
              <option value="sierra">Sierra Lite</option>
            </optgroup>
            <optgroup label="Ordered pattern">
              <option value="b2">Bayer 2×2</option>
              <option value="b4">Bayer 4×4</option>
              <option value="b8">Bayer 8×8</option>
              <option value="dots">Halftone dots</option>
              <option value="lines">Halftone lines</option>
            </optgroup>
            <optgroup label="Other">
              <option value="noise" selected>Random noise</option>
              <option value="none">Hard threshold</option>
            </optgroup>
          </select>
        </label>
        <label class="row">Strength<input type="range" id="strength" min="0" max="1.5" step="0.01" value="1"><output></output></label>
        <label class="row">Pattern size<input type="range" id="cell" min="3" max="24" step="1" value="6"><output></output></label>
        <button type="button" id="reseed">New noise seed</button>
      </fieldset>
      <fieldset>
        <legend>Color</legend>
        <label class="sel">Mode
          <select id="mode">
            <option value="ink">Ink &amp; paper</option>
            <option value="rgb">Full color (RGB)</option>
            <option value="gb">Palette: handheld green</option>
            <option value="cga">Palette: CGA</option>
            <option value="riso">Palette: riso pink/blue</option>
            <option value="p16">Palette: 16-color</option>
          </select>
        </label>
        <label class="row">Levels<input type="range" id="levels" min="2" max="8" step="1" value="2"><output></output></label>
        <label class="sel">Ink<input type="color" id="ink" value="#000000"></label>
        <label class="sel">Paper<input type="color" id="paper" value="#ffffff"></label>
      </fieldset>
    </form>
    <div class="stage">
      <div class="table" id="table"><canvas id="out" aria-label="Dithered result"></canvas></div>
      <div class="meta"><span id="info"></span><span>Save: right-click (or long-press) the image → Save image. You can also drag in or paste an image.</span></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const out=$('out'),octx=out.getContext('2d');
const src=document.createElement('canvas'),work=document.createElement('canvas');
let seed=7,name='Sample image';
const ids=['px','bright','contrast','gamma','grain','strength','cell','levels','algo','mode','ink','paper','invert','orig'];
const defaults={};ids.forEach(i=>defaults[i]=$(i).type==='checkbox'?$(i).checked:$(i).value);

const KERN={
 fs:[16,[1,0,7],[-1,1,3],[0,1,5],[1,1,1]],
 atk:[8,[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]],
 jjn:[48,[1,0,7],[2,0,5],[-2,1,3],[-1,1,5],[0,1,7],[1,1,5],[2,1,3],[-2,2,1],[-1,2,3],[0,2,5],[1,2,3],[2,2,1]],
 stucki:[42,[1,0,8],[2,0,4],[-2,1,2],[-1,1,4],[0,1,8],[1,1,4],[2,1,2],[-2,2,1],[-1,2,2],[0,2,4],[1,2,2],[2,2,1]],
 burkes:[32,[1,0,8],[2,0,4],[-2,1,2],[-1,1,4],[0,1,8],[1,1,4],[2,1,2]],
 sierra:[4,[1,0,2],[-1,1,1],[0,1,1]]
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const PAL={
 gb:['#0f380f','#306230','#8bac0f','#9bbc0f'],
 cga:['#000000','#55ffff','#ff55ff','#ffffff'],
 riso:['#f2ede4','#ff48b0','#0078bf','#2b2b2b','#7a4fb5'],
 p16:['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa']
};
for(const k in PAL)PAL[k]=PAL[k].map(hex);

function bayer(n){let m=[[0]];for(let s=1;s<n;s*=2){const r=[];for(let y=0;y<s*2;y++){r.push([]);for(let x=0;x<s*2;x++){const b=m[y%s][x%s]*4;r[y][x]=b+[[0,2],[3,1]][y<s?0:1][x<s?0:1];}}m=r;}
 return (x,y)=>(m[y%n][x%n]+.5)/(n*n);}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function render(){
  const v={};ids.forEach(i=>v[i]=$(i).type==='checkbox'?$(i).checked:$(i).value);
  document.querySelectorAll('label.row').forEach(l=>l.querySelector('output').textContent=l.querySelector('input').value);
  const diff=KERN[v.algo], pal=PAL[v.mode], isInk=v.mode==='ink';
  $('cell').disabled=!(v.algo==='dots'||v.algo==='lines');
  $('reseed').disabled=!(v.algo==='noise'||+v.grain>0);
  $('levels').disabled=!!pal; $('ink').disabled=$('paper').disabled=!isInk;
  const sc=+v.px, w=Math.max(1,Math.round(src.width/sc)), h=Math.max(1,Math.round(src.height/sc));
  out.width=w*sc; out.height=h*sc; octx.imageSmoothingEnabled=false;
  if(v.orig){octx.drawImage(src,0,0,out.width,out.height);$('info').textContent=name+' · original '+src.width+'×'+src.height;return;}
  work.width=w;work.height=h;const wc=work.getContext('2d',{willReadFrequently:true});
  wc.fillStyle='#fff';wc.fillRect(0,0,w,h);wc.drawImage(src,0,0,w,h);
  const im=wc.getImageData(0,0,w,h),d=im.data,f=new Float32Array(w*h*3),rnd=rng(seed);
  const br=+v.bright,ct=+v.contrast,gm=+v.gamma,gr=+v.grain,st=+v.strength,n=+v.levels;
  for(let i=0,j=0;i<d.length;i+=4,j+=3){
    let c=[d[i]/255,d[i+1]/255,d[i+2]/255];
    if(isInk){const l=.299*c[0]+.587*c[1]+.114*c[2];c=[l,l,l];}
    const g=gr?(rnd()-.5)*gr:0;
    for(let k=0;k<3;k++){let x=(c[k]-.5)*ct+.5+br;x=Math.pow(Math.min(1,Math.max(0,x)),gm);if(v.invert)x=1-x;f[j+k]=x+g;}
  }
  const cl=x=>x<0?0:x>1?1:x;
  const q=pal?(r,g,b)=>{let best=pal[0],bd=1e9;for(const p of pal){const e=(r-p[0])**2+(g-p[1])**2+(b-p[2])**2;if(e<bd){bd=e;best=p;}}return best;}
           :(r,g,b)=>[Math.round(cl(r)*(n-1))/(n-1),Math.round(cl(g)*(n-1))/(n-1),Math.round(cl(b)*(n-1))/(n-1)];
  let T=null;const cs=+v.cell;
  if(v.algo==='noise')T=()=>rnd();
  else if(v.algo[0]==='b'&&v.algo!=='burkes')T=bayer(+v.algo[1]);
  else if(v.algo==='dots')T=(x,y)=>.5+Math.cos((x+y)/cs*Math.PI)*Math.cos((x-y)/cs*Math.PI)/2;
  else if(v.algo==='lines')T=(x,y)=>((x+y)%cs+.5)/cs;
  const spread=st/(pal?2:(n-1));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const j=(y*w+x)*3;let r=f[j],g=f[j+1],b=f[j+2];
    if(T){const t=(T(x,y)-.5)*spread;r+=t;g+=t;b+=t;}
    const c=q(r,g,b);
    if(diff){const e=[(r-c[0])*st,(g-c[1])*st,(b-c[2])*st];
      for(let k=1;k<diff.length;k++){const xx=x+diff[k][0],yy=y+diff[k][1];if(xx<0||xx>=w||yy>=h)continue;const m=diff[k][2]/diff[0],jj=(yy*w+xx)*3;f[jj]+=e[0]*m;f[jj+1]+=e[1]*m;f[jj+2]+=e[2]*m;}}
    f[j]=c[0];f[j+1]=c[1];f[j+2]=c[2];
  }
  const ink=hex(v.ink),pap=hex(v.paper);
  for(let i=0,j=0;i<d.length;i+=4,j+=3)for(let k=0;k<3;k++)d[i+k]=255*(isInk?ink[k]+(pap[k]-ink[k])*f[j]:f[j+k]);
  wc.putImageData(im,0,0);octx.drawImage(work,0,0,out.width,out.height);
  {const [W,H]=exportSize();$('info').textContent=name+' · '+w+'×'+h+' dots · saves at '+W+'×'+H+' px';}
}
let raf=0;const queue=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render);};

function sample(){
  src.width=480;src.height=600;const c=src.getContext('2d');
  let g=c.createLinearGradient(0,0,480,600);g.addColorStop(0,'#f4f6ff');g.addColorStop(1,'#4a5a8c');c.fillStyle=g;c.fillRect(0,0,480,600);
  g=c.createRadialGradient(190,210,10,240,280,190);g.addColorStop(0,'#fff8e0');g.addColorStop(.5,'#e0703a');g.addColorStop(1,'#1a0f2e');
  c.fillStyle=g;c.beginPath();c.arc(240,280,170,0,7);c.fill();
  g=c.createRadialGradient(240,500,0,240,500,200);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.save();c.scale(1,.25);c.translate(0,1500);c.fillStyle=g;c.fillRect(0,300,480,400);c.restore();
  g=c.createLinearGradient(30,0,450,0);g.addColorStop(0,'#000');g.addColorStop(1,'#fff');c.fillStyle=g;c.fillRect(30,550,420,24);
}
function load(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=Math.min(1,2400/Math.max(img.width,img.height));src.width=Math.round(img.width*m);src.height=Math.round(img.height*m);
    src.getContext('2d').drawImage(img,0,0,src.width,src.height);URL.revokeObjectURL(url);name=file.name||'Pasted image';render();};
  img.onerror=()=>{$('info').textContent='That file could not be read as an image. Try a PNG or JPG.';};
  img.src=url;
}
$('file').onchange=e=>load(e.target.files[0]);
const tb=$('table');
addEventListener('dragover',e=>{e.preventDefault();tb.classList.add('drag');});
addEventListener('dragleave',()=>tb.classList.remove('drag'));
addEventListener('drop',e=>{e.preventDefault();tb.classList.remove('drag');load(e.dataTransfer.files[0]);});
addEventListener('paste',e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/'))load(it.getAsFile());});
$('controls').addEventListener('input',queue);
$('reseed').onclick=()=>{seed=Math.random()*1e9|0;render();};
$('reset').onclick=()=>{ids.forEach(i=>{const el=$(i);if(el.type==='checkbox')el.checked=defaults[i];else el.value=defaults[i];});render();};
function exportSize(){
  const t=+$('outsize').value,m=Math.max(work.width,work.height);
  if(!t||$('orig').checked)return [out.width,out.height];
  let k=Math.floor(t/m);
  if(k>=1&&k*m>=1500)return [work.width*k,work.height*k];
  const f=t/m;return [Math.round(work.width*f),Math.round(work.height*f)];
}
function exportCanvas(){
  const [W,H]=exportSize();if(W===out.width&&H===out.height)return out;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(work,0,0,W,H);return c;
}
sample();render();
(function(){
  const b=$('save'),msg=$('savemsg');b.hidden=false;
  const say=t=>{msg.textContent=t;msg.hidden=!t;};
  const fname=()=>(name.replace(/\.[^.]+$/,'').replace(/\s+/g,'-').toLowerCase()||'print')+'-'+$('algo').value+'.png';
  let dl=null;
  window.claude?.use?.('downloads').then(d=>{dl=d||null;}).catch(()=>{});
  b.onclick=()=>exportCanvas().toBlob(async blob=>{
    if(!blob){say('The print could not be encoded. Try a larger pixel size.');return;}
    if(dl){
      try{await dl.save({filename:fname(),data:blob});say('Saved.');}
      catch(e){say(e&&e.code==='declined'?'':'Saving is not available here. Right-click the image and choose Save image.');}
      return;
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=fname();document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);say('Saved to your downloads.');
  },'image/png');
})();
</script>

</body></html>
